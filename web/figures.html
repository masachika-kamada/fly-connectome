<h1>キノコ体は、ランダム配線に勝っているのか</h1>
<p class="sub">右半球のキノコ体の実測配線を、一部の性質だけを保ったランダム配線と比べた6枚。数字の出どころと限界は docs/RESULTS.md に。</p>

<figure>
  <img src="figures/fig1.svg" alt="実配線とランダム配線のハッシュ性能比較。実配線は次数保存の張り替えやPN側のみ保存と同程度で、一様ランダムに大きく負ける">
  <figcaption><span class="n">FIG 1</span><b>どの糸球体がどのKCに繋がるかには、情報がない。</b>次数を保って全部張り替えても、PN側（各入力が何個のKCに届くか）だけ保っても、成績は実測と変わらない。一様ランダムとの差は、PN側の偏りで丸ごと説明できる。ただし差の大きさは採点しだいで、キノコ体が読まない次元（多糸球体PN、温度・湿度）を正解から外すと、+112% から +67% に縮む。</figcaption>
</figure>
<figure>
  <img src="figures/fig2.svg" alt="糸球体ごとのケニヨン細胞への結合数。温度・湿度の糸球体はほぼゼロ">
  <figcaption><span class="n">FIG 2</span><b>偏りのうち確かなのは、温度と湿度をほぼ読まないこと。</b>上位には食物系の糸球体もあるが、フェロモン系はむしろ中位で、「食物とフェロモンに寄せている」とまでは言えない。</figcaption>
</figure>
<figure>
  <img src="figures/fig3.svg" alt="記憶件数と分離性能。実測、張り替え、一様ランダムの3本の曲線がほぼ重なる">
  <figcaption><span class="n">FIG 3</span><b>1区画で約20件まで、ほぼ完全に見分けられる。</b>解析近似 (1−f)^k より容量はずっと大きい。張り替えとの差は小さいが、区画ごとに対応をとると張り替えのほうがわずかに上（AUC +0.014）。実物の区画は特定の葉のKCしか読まないためと考えられる。</figcaption>
</figure>
<figure>
  <img src="figures/fig4.svg" alt="区画が読むケニヨン細胞の数と、記憶20件での分離性能の散布図。右肩上がり">
  <figcaption><span class="n">FIG 4</span><b>容量は区画の大きさで決まる。</b>読むKCが多い区画ほど多く覚えられる。最大はMBON11、嫌悪学習で最もよく研究されている区画。</figcaption>
</figure>
<figure>
  <img src="figures/fig5.svg" alt="実在の匂い67種での類似度保存。実配線は張り替え20本の分布の中央にある">
  <figcaption><span class="n">FIG 5</span><b>実在の匂いで測り直しても、結論は同じ。</b>DoOR 2.0 の67物質で、似た匂いが似たKCコードになるかを測った。実配線は張り替え20本のちょうど真ん中。合成データで得た①②は、匂いの作り方の産物ではない。</figcaption>
</figure>
<figure>
  <img src="figures/fig6.svg" alt="ハエのおつかいの結果。頼んだ品と持ってきた品の表と、配線ごとの正答率">
  <figcaption><span class="n">FIG 6</span><b>行動まで通すと、実物の配線が効いてくる。</b>1回嗅がせた商品を店から取ってこさせると、正答は74%（でたらめなら7%）。取り違えるのは香りの成分がかぶる組だけ（杏仁豆腐→ワイン、バター→お酢、バナナ⇄日本酒）。張り替えた脳38個はすべて実物より成績が低い。似たものを似たまま保つ成績では一様ランダムが上だったので、見分ける課題では向きが逆になる。歩き方と匂いの広がりは仮定。</figcaption>
</figure>
